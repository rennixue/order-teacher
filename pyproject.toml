[project]
name = "order-teacher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncmy>=0.2.11",
    "chardet>=7.4.3",
    "jinja2>=3.1.6",
    "openai>=2.41.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "rarfile>=4.2",
    "sqlalchemy>=2.0.50",
    "starlette>=1.3.1",
    "tenacity>=9.1.4",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "polars>=1.42.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "xlsxwriter>=3.2.9",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["F405"]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest]
minversion = "9.0"
addopts = [
    "--capture=no",
    "--import-mode=importlib",
]
log_cli_level="INFO"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope="function"
asyncio_mode = "auto"
